name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas
      - run: npm ci
      - run: npm run typecheck
      - run: JR_PYTHON=$(which python) npm test
      - run: npm run accuracy
      - run: git diff --exit-code fixtures/join-receipt/accuracy.json
      - run: npm run accuracy:real
      - run: git diff --exit-code fixtures/join-receipt/accuracy-real.json
      - run: npm run build -w join-receipt
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report, retention-days: 7 }
